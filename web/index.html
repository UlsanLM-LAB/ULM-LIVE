<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ULM Live</title>
<style>
:root{color-scheme:dark;font-family:Inter,Pretendard,system-ui,sans-serif;background:#090b10;color:#f5f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 25%,#26304a 0,#10141f 30%,#090b10 62%);overflow-x:hidden}
main{width:min(760px,100%);min-height:100vh;margin:auto;padding:28px 20px 38px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:18px;font-weight:750;letter-spacing:-.02em}.badge{font-size:12px;padding:7px 10px;border:1px solid #ffffff22;border-radius:999px;background:#ffffff0b;color:#cfd7e6}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:520px}.orb-wrap{position:relative;width:238px;height:238px;display:grid;place-items:center}.halo{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle,#95a8ff33,transparent 67%);filter:blur(16px);transform:scale(1.2);transition:.35s}
.orb{width:164px;height:164px;border:0;border-radius:50%;cursor:pointer;color:white;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#b8c6ff 0,#6d7bdc 22%,#4050a8 52%,#19224f 100%);box-shadow:0 25px 80px #4050a866,inset 0 1px 1px #ffffff80;transition:.25s transform,.25s filter}.orb:active{transform:scale(.96)}
.orb svg{width:47px;height:47px;filter:drop-shadow(0 3px 8px #0006)}
body[data-state="listening"] .orb{animation:pulse 1.35s infinite;background:radial-gradient(circle at 35% 28%,#d6f6ff,#59cde8 26%,#2874aa 62%,#133b63)}
body[data-state="thinking"] .orb{animation:spin 2.8s linear infinite;filter:saturate(.7)}
body[data-state="speaking"] .orb{animation:speak .72s ease-in-out infinite alternate;background:radial-gradient(circle at 35% 28%,#e1d9ff,#a37ce6 30%,#6843aa 65%,#35235c)}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 30px 100px #3dc9ff88,inset 0 1px 1px #fff}}@keyframes speak{to{transform:scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}
.status{margin-top:24px;font-size:20px;font-weight:700;letter-spacing:-.03em}.hint{margin-top:7px;font-size:13px;color:#9da8ba}
.panel{width:100%;border:1px solid #ffffff15;background:#ffffff09;backdrop-filter:blur(18px);border-radius:24px;padding:18px 18px 12px;box-shadow:0 18px 70px #0005}.turn{padding:12px 2px;border-bottom:1px solid #ffffff0d}.turn:last-child{border:0}.who{font-size:11px;color:#7f8ba0;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.text{line-height:1.55;font-size:15px;white-space:pre-wrap}.assistant .text{color:#e3e8ff}.empty{color:#7d8797;text-align:center;padding:22px 0}
.controls{display:flex;gap:10px;margin-top:12px}.small{border:1px solid #ffffff1c;background:#ffffff0a;color:#cfd7e6;border-radius:12px;padding:9px 12px;cursor:pointer}.error{color:#ff9c9c;font-size:13px;margin-top:12px;min-height:20px;text-align:center}
.dialect-selector{align-self:center;max-width:100%;margin:20px 0 0;padding:0;border:0;min-width:0}.dialect-selector legend{font-size:12px;color:#9da8ba;margin-bottom:7px}.dialect-options{display:flex;gap:4px;padding:4px;border:1px solid #ffffff22;border-radius:999px;background:#ffffff09}.dialect-option{position:relative;cursor:pointer}.dialect-option input{position:absolute;width:1px;height:1px;opacity:0}.dialect-option span{display:block;padding:7px 12px;border-radius:999px;font-size:12px;color:#9da8ba;white-space:nowrap}.dialect-option input:checked+span{background:#b8c6ff;color:#19224f;font-weight:700}.dialect-option input:focus-visible+span{outline:2px solid #b8c6ff;outline-offset:2px}
@media(max-width:520px){main{padding:20px 14px}.stage{min-height:470px}.orb-wrap{width:210px;height:210px}.orb{width:150px;height:150px}}
</style>
</head>
<body data-state="idle">
<main>
<header><div class="brand">ULM Live</div><div class="badge" id="health">ULM-4B · 울산 음성</div></header>
<fieldset class="dialect-selector">
<legend>사투리 강도</legend>
<div class="dialect-options">
<label class="dialect-option" title="표준어 중심에 가벼운 울산 표현"><input type="radio" name="dialect-strength" value="1" aria-label="약하게: 표준어 중심에 가벼운 울산 표현"><span>약하게</span></label>
<label class="dialect-option" title="자연스러운 울산 일상 말투"><input type="radio" name="dialect-strength" value="2" aria-label="보통: 자연스러운 울산 일상 말투" checked><span>보통</span></label>
<label class="dialect-option" title="울산 어휘와 종결어미를 적극 사용"><input type="radio" name="dialect-strength" value="3" aria-label="강하게: 울산 어휘와 종결어미를 적극 사용"><span>강하게</span></label>
</div>
</fieldset>
<section class="stage">
<div class="orb-wrap"><div class="halo"></div><button class="orb" id="mic" aria-label="마이크 시작">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
</button></div>
<div class="status" id="status">말해보세요</div>
<div class="hint" id="hint">버튼을 눌러 대화를 시작합니다</div>
<div class="error" id="error"></div>
</section>
<section class="panel"><div id="log"><div class="empty">대화 내용이 여기에 표시됩니다.</div></div>
<div class="controls"><button class="small" id="clear">대화 지우기</button><button class="small" id="replay" disabled>마지막 답변 다시 듣기</button></div></section>
</main>
<script>
const body=document.body,mic=document.getElementById('mic'),statusEl=document.getElementById('status'),hint=document.getElementById('hint'),errorEl=document.getElementById('error'),logEl=document.getElementById('log'),clearBtn=document.getElementById('clear'),replayBtn=document.getElementById('replay'),healthEl=document.getElementById('health');
const DIALECT_STORAGE_KEY='ulm_dialect_strength';
const dialectOptions=document.querySelectorAll('input[name="dialect-strength"]');
function readDialectStrength(){try{const saved=localStorage.getItem(DIALECT_STORAGE_KEY);return /^[1-3]$/.test(saved??'')?Number(saved):2}catch{return 2}}
let dialectStrength=readDialectStrength();
function setDialectStrength(value){dialectStrength=Number.isInteger(value)&&value>=1&&value<=3?value:2;for(const option of dialectOptions)option.checked=Number(option.value)===dialectStrength;try{localStorage.setItem(DIALECT_STORAGE_KEY,String(dialectStrength))}catch{}}
function buildChatSpeechPayload(prompt,history){return{prompt,history,dialect_strength:dialectStrength}}
for(const option of dialectOptions){option.checked=Number(option.value)===dialectStrength;option.addEventListener('change',()=>{if(option.checked)setDialectStrength(Number(option.value))})}
let recorder=null,chunks=[],stream=null,history=[],audio=null,lastAudioUrl=null,controller=null;
const labels={idle:['말해보세요','버튼을 눌러 대화를 시작합니다'],listening:['듣고 있어요','다 말했으면 버튼을 다시 눌러주세요'],thinking:['생각하는 중','음성을 이해하고 답변을 만들고 있어요'],speaking:['답변하는 중','버튼을 누르면 말을 끊고 다시 말할 수 있어요']};
function setState(s){body.dataset.state=s;statusEl.textContent=labels[s][0];hint.textContent=labels[s][1];mic.setAttribute('aria-label',labels[s][0])}
function fail(e){console.error(e);errorEl.textContent=e&&e.message?e.message:String(e);setState('idle')}
function hexText(hex){if(!hex)return'';const parts=hex.match(/.{1,2}/g)||[];const a=new Uint8Array(parts.map(x=>parseInt(x,16)));return new TextDecoder().decode(a)}
function render(){logEl.innerHTML='';if(!history.length){logEl.innerHTML='<div class="empty">대화 내용이 여기에 표시됩니다.</div>';return}for(const m of history){const d=document.createElement('div');d.className='turn '+m.role;d.innerHTML='<div class="who">'+(m.role==='user'?'나':'ULM')+'</div><div class="text"></div>';d.querySelector('.text').textContent=m.content;logEl.appendChild(d)}}
async function blobToWav(blob){const ab=await blob.arrayBuffer();const ctx=new AudioContext();const decoded=await ctx.decodeAudioData(ab.slice(0));const rate=16000,frames=Math.max(1,Math.round(decoded.duration*rate));const off=new OfflineAudioContext(1,frames,rate),src=off.createBufferSource();src.buffer=decoded;src.connect(off.destination);src.start();const rendered=await off.startRendering();await ctx.close();return encodeWav(rendered.getChannelData(0),rate)}
function encodeWav(samples,rate){const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b);const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+samples.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,samples.length*2,true);let o=44;for(const x of samples){const s=Math.max(-1,Math.min(1,x));v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}return new Blob([b],{type:'audio/wav'})}
async function startListening(){errorEl.textContent='';if(audio){audio.pause();audio=null}if(controller){controller.abort();controller=null}stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.start();setState('listening')}
async function stopListening(){if(!recorder)return;const done=new Promise(r=>recorder.onstop=r);recorder.stop();await done;stream&&stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType});recorder=null;setState('thinking');const wav=await blobToWav(blob);controller=new AbortController();const tr=await fetch('/v1/audio/transcriptions',{method:'POST',headers:{'Content-Type':'audio/wav'},body:wav,signal:controller.signal});if(!tr.ok){const j=await tr.json();throw new Error(j.detail||'음성 인식 실패')}const tj=await tr.json();const text=tj.text;history.push({role:'user',content:text});render();const previous=history.slice(0,-1).slice(-12);const resp=await fetch('/v1/chat/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(buildChatSpeechPayload(text,previous)),signal:controller.signal});if(!resp.ok){const j=await resp.json();throw new Error(j.detail||'ULM 응답 실패')}const answer=hexText(resp.headers.get('X-ULM-Text'));const audioBlob=await resp.blob();history.push({role:'assistant',content:answer});render();if(lastAudioUrl)URL.revokeObjectURL(lastAudioUrl);lastAudioUrl=URL.createObjectURL(audioBlob);replayBtn.disabled=false;playLast()}
function playLast(){if(!lastAudioUrl)return;if(audio)audio.pause();audio=new Audio(lastAudioUrl);audio.onended=()=>{audio=null;setState('idle')};audio.onerror=()=>fail(new Error('음성 재생 실패'));setState('speaking');audio.play()}
mic.onclick=async()=>{try{const s=body.dataset.state;if(s==='listening')await stopListening();else await startListening()}catch(e){if(!e||e.name!=='AbortError')fail(e)}}
clearBtn.onclick=()=>{history=[];render();errorEl.textContent=''};
replayBtn.onclick=()=>playLast();
fetch('/health').then(r=>r.json()).then(h=>{if(h.status==='ready')healthEl.textContent=(h.text_model||'ULM-4B')+' · '+(h.tts_adapter_loaded?'울산 TTS':'기본 TTS')}).catch(()=>{healthEl.textContent='서버 확인 필요'});
</script>
</body>
</html>
