talker:
  # Model architecture dimensions
  semantic_dim: 2048       # Dimension of ULM-1.7B Thinker hidden states
  talker_dim: 512          # Internal Talker Transformer hidden dimension
  num_layers: 6            # Number of causal Transformer layers
  num_heads: 8             # Number of attention heads
  dim_feedforward: 2048    # FFN hidden dimension
  dropout: 0.1             # Dropout probability
  max_seq_len: 2048        # Maximum sequence length

  # Neural Codec token dimensions (Mimi codec compatibility)
  num_quantizers: 32       # Number of RVQ codebooks (32 for full Mimi, or 8 for lightweight)
  codebook_size: 2048      # Mimi codebook vocabulary size per quantizer
  pad_token_id: 2048       # Pad token ID (codebook_size index reserved for PAD)

  # Conditioning dimensions
  speaker_embedding_dim: 128
  dialect_embedding_dim: 64
  num_speakers: 256
  num_dialects: 16
  conditioning_mode: "additive"  # "additive" or "concat"

  # Training defaults
  learning_rate: 0.0002
  weight_decay: 0.01
  freeze_thinker: true
